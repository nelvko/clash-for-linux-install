# 全局配置 
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: warning
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 为防止使用插件朋友遇到面板问题，我注释掉了此模块。
#external-controller: 0.0.0.0:9090
#secret: ""
#external-ui: ui
#external-ui-name: zashboard
#external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探（fakeip下其实可以不用嗅探）
# sniffer:
#   enable: true
#   sniff:
#     HTTP:
#       ports: [80, 8080-8880]
#       override-destination: true
#     TLS:
#       ports: [443, 8443]
#     QUIC:
#       ports: [443, 8443]
#   skip-domain:
#     - "Mijia Cloud"
#     - "+.push.apple.com"

# 入站
tun:
  enable: true
  # system/gvisor/mixed
  stack: gvisor
  dns-hijack: ["any:53", "tcp://any:53"]
  #使用nikki，混入全部不修改的情况，开启接口指定为nikki
  #device: nikki
  #使用仅内核自行修改下面三项为true
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"
  default-nameserver:
    - system
    - https://223.5.5.5/dns-query
  # 专门用来解析代理（proxies)节点服务器域名的 DNS
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:cn_domain":
      - system
    "+.cn":
      - system
    "rule-set:geolocation-!cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

# 锚点，用于简化配置
# for proxy-providers
pp: &pp { type: http, interval: 86400, proxy: DIRECT, health-check: { enable: true, url: http://www.google.com/generate_204, interval: 300, lazy: true } }

# 代理集合
proxy-providers:
  Maruko: { <<: *pp, url: "https://substore.muteki.site/2cXaAfCgfddmGz2yx1wA/download/collection/Maruko" }

  # 落地订阅占位：需要使用时，取消下面注释并把 url 改成真实订阅地址
  # 落地:
  #   <<: *pp
  #   url: "https://example.com/landing-subscription"
  #   override:
  #     dialer-proxy: 前置节点
  
# 节点信息
proxies:
  - { name: 直连, type: direct }

# 锚点,用于简化配置
# for proxy-providers
proxy-anchor:
  pg: &pg { type: select, proxies: [默认代理, 香港自动, 日本自动, 台湾自动, 狮城自动, 美国自动, 自动选择, 香港节点, 日本节点, 台湾节点, 美国节点, 尼日利亚节点, 全部节点, 香港故转, 日本故转, 台湾故转, 狮城故转, 美国故转, 落地节点, 直连], icon: "https://www.svgrepo.com/show/497934/direct-right.svg" }

# 出站策略，根据自己情况调整每个策略里分组排序，增删都可以，比如把美国自动放到第一个，比如删除香港故转，注意别漏掉表情逗号等【Maruko:不带emoji，是因为 Proxy-groups 支持 icon 】。
# 如果相应分组没有筛选到对应的国家，请根据自己节点名字调整筛选关键字。
# 没有再使用锚点，是考虑很多新手修改难度，这样新手修改某个分组更容易些【Maruko:但是我还是用了锚点来简化配置，毕竟很多分组的节点是一样的】。
